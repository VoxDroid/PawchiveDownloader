name: Release

# Builds installers for every platform and attaches them to a draft release.
# Push a tag like v1.2.0, or run it by hand to get the files as artifacts.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  NODE_VERSION: '22'

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            args: ''
          - name: macOS (Apple Silicon and Intel)
            os: macos-latest
            args: --target universal-apple-darwin
          - name: Linux x64
            os: ubuntu-22.04
            args: ''
    steps:
      - uses: actions/checkout@v7
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev \
            libayatana-appindicator3-dev librsvg2-dev rpm
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile

      - name: Build and publish
        if: startsWith(github.ref, 'refs/tags/')
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Pawchive Downloader ${{ github.ref_name }}
          releaseBody: See CHANGELOG.md for what changed. Installers for Windows, macOS and Linux are attached below.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: Build only
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: pnpm tauri build ${{ matrix.args }}

      - name: Portable Windows build
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $dir = "PawchiveDownloader-$version-portable-x64"
          New-Item -ItemType Directory -Force $dir | Out-Null
          Copy-Item "src-tauri/target/release/pawchive-downloader.exe" "$dir/Pawchive Downloader.exe"
          Copy-Item LICENSE "$dir/LICENSE.txt"
          Set-Content "$dir/README.txt" "Pawchive Downloader $version, portable build.`r`nRun 'Pawchive Downloader.exe'. Needs the Microsoft Edge WebView2 Runtime, which Windows 10 and 11 already include.`r`nSettings and the library are stored in %APPDATA%\io.github.voxdroid.pawchivedownloader."
          Compress-Archive -Path $dir -DestinationPath "$dir.zip"
          if ("${{ github.ref }}".StartsWith("refs/tags/")) {
            gh release upload "${{ github.ref_name }}" "$dir.zip" --clobber
          }
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Keep the installers
        uses: actions/upload-artifact@v7
        with:
          name: installers-${{ runner.os }}
          path: |
            src-tauri/target/**/release/bundle/**/*.exe
            src-tauri/target/**/release/bundle/**/*.msi
            src-tauri/target/**/release/bundle/**/*.dmg
            src-tauri/target/**/release/bundle/**/*.AppImage
            src-tauri/target/**/release/bundle/**/*.deb
            src-tauri/target/**/release/bundle/**/*.rpm
            PawchiveDownloader-*-portable-x64.zip
          if-no-files-found: warn
          retention-days: 14
